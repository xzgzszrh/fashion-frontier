# CPU route, step 4 -- the balanced tier, and the default recommendation
# for most scenarios (see docs/08-scenario-playbook.md).
#
# Paper Table 8: 91.09 % host accuracy, 375.99 img/s, 26.60 s for 10 000 images.
experiment_name: tinyfast_xxs
seed: 42
data_dir: data
output_dir: outputs/tinyfast_xxs
device: auto

data:
  image_size: 28
  repeat_channels: 1

model:
  name: tiny_fashion_cnn
  variant: tinyfast_xxs
  input_size: 28

training:
  batch_size: 256
  epochs: 24
  learning_rate: 0.0008
  optimizer: adamw
  weight_decay: 0.00008
  label_smoothing: 0.0
  grad_clip_norm: 1.0
  ema_decay: 0.9994
  ema_start_epoch: 2
  num_workers: 0
  val_split: 0.1
  split_seed: 42
  augmentation:
    random_crop_padding: 2
    rotation_degrees: 7
    translate: 0.05
    scale_min: 0.96
    scale_max: 1.04
    random_erasing_prob: 0.03
  scheduler:
    name: warmup_cosine
    warmup_epochs: 1
    start_factor: 0.3
    eta_min: 0.00001

distillation:
  teacher_targets_path: outputs/soft_targets/teacher_targets_full_train.npz
  method: blend
  alpha: 0.35

export:
  onnx_opset: 17
