# CPU route, step 2 -- accuracy-first delivery tier.
# val_split=0: finalised on all 60 000 training images, no validation monitor.
#
# Paper Table 8: 92.21 % host accuracy, 186.8 img/s on PYNQ-Z1,
# ~53.5 s for the full 10 000-image test set.
experiment_name: tinyplus_kd_fulltrain
seed: 42
data_dir: data
output_dir: outputs/tinyplus_kd_fulltrain
device: auto
init_checkpoint: outputs/tinyplus_kd/best_model.pt

data:
  image_size: 28
  repeat_channels: 1

model:
  name: tiny_fashion_cnn
  variant: tinyplus
  input_size: 28

training:
  batch_size: 256
  epochs: 6
  learning_rate: 0.00008
  optimizer: adamw
  weight_decay: 0.00006
  label_smoothing: 0.0
  grad_clip_norm: 1.0
  ema_decay: 0.9996
  ema_start_epoch: 1
  num_workers: 0
  val_split: 0.0
  split_seed: 42
  augmentation:
    random_crop_padding: 1
    rotation_degrees: 4
    translate: 0.03
    scale_min: 0.98
    scale_max: 1.02
    random_erasing_prob: 0.02
  scheduler:
    name: warmup_cosine
    warmup_epochs: 1
    start_factor: 0.5
    eta_min: 0.00001

distillation:
  teacher_targets_path: outputs/soft_targets/teacher_targets_full_train.npz
  method: blend
  alpha: 0.25

export:
  onnx_opset: 17
