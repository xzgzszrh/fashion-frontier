<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Accuracy versus throughput on PYNQ-Z1">
<rect width="1200" height="680" fill="#ffffff"/>
<text x="90.0" y="44" font-size="25" font-weight="700" fill="#0f172a">Accuracy vs throughput on PYNQ-Z1</text>
<text x="90.0" y="70" font-size="14.5" fill="#64748b">Four CPU delivery tiers and one FPGA fabric route, every point measured on the board &#183; Fashion-MNIST test set</text>
<line x1="90.0" y1="492.9" x2="1140.0" y2="492.9" stroke="#e2e8f0" stroke-width="1"/>
<text x="76.0" y="496.9" font-size="12.5" fill="#64748b" text-anchor="end">84%</text>
<line x1="90.0" y1="425.7" x2="1140.0" y2="425.7" stroke="#e2e8f0" stroke-width="1"/>
<text x="76.0" y="429.7" font-size="12.5" fill="#64748b" text-anchor="end">86%</text>
<line x1="90.0" y1="358.6" x2="1140.0" y2="358.6" stroke="#e2e8f0" stroke-width="1"/>
<text x="76.0" y="362.6" font-size="12.5" fill="#64748b" text-anchor="end">88%</text>
<line x1="90.0" y1="291.4" x2="1140.0" y2="291.4" stroke="#e2e8f0" stroke-width="1"/>
<text x="76.0" y="295.4" font-size="12.5" fill="#64748b" text-anchor="end">90%</text>
<line x1="90.0" y1="224.3" x2="1140.0" y2="224.3" stroke="#e2e8f0" stroke-width="1"/>
<text x="76.0" y="228.3" font-size="12.5" fill="#64748b" text-anchor="end">92%</text>
<line x1="90.0" y1="157.1" x2="1140.0" y2="157.1" stroke="#e2e8f0" stroke-width="1"/>
<text x="76.0" y="161.1" font-size="12.5" fill="#64748b" text-anchor="end">94%</text>
<line x1="90.0" y1="90.0" x2="1140.0" y2="90.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="76.0" y="94.0" font-size="12.5" fill="#64748b" text-anchor="end">96%</text>
<line x1="155.6" y1="90.0" x2="155.6" y2="560.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="155.6" y="586.0" font-size="12.5" fill="#64748b" text-anchor="middle">10</text>
<line x1="374.4" y1="90.0" x2="374.4" y2="560.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="374.4" y="586.0" font-size="12.5" fill="#64748b" text-anchor="middle">100</text>
<line x1="593.1" y1="90.0" x2="593.1" y2="560.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="593.1" y="586.0" font-size="12.5" fill="#64748b" text-anchor="middle">1 000</text>
<line x1="811.9" y1="90.0" x2="811.9" y2="560.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="811.9" y="586.0" font-size="12.5" fill="#64748b" text-anchor="middle">10 000</text>
<line x1="1030.6" y1="90.0" x2="1030.6" y2="560.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="1030.6" y="586.0" font-size="12.5" fill="#64748b" text-anchor="middle">100 000</text>
<line x1="90.0" y1="560.0" x2="1140.0" y2="560.0" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="90.0" y1="90.0" x2="90.0" y2="560.0" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="615" y="616.0" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="600">Throughput (img/s, log scale)</text>
<text x="26" y="325" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="600" transform="rotate(-90 26 325)">Test accuracy</text>
<polyline fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" points="433.7,217.2 500.2,254.8 516.2,276.3"/>
<path d="M 155.6 131.3 L 433.7 217.2" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M 516.2 276.3 L 1071.7 521.1" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-dasharray="9 6"/>
<text x="794" y="381" font-size="12.5" font-weight="600" fill="#ea580c" text-anchor="middle">346&#215; the throughput, 7.3 accuracy points</text>
<circle cx="155.6" cy="131.3" r="7" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/>
<circle cx="433.7" cy="217.2" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<circle cx="500.2" cy="254.8" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<circle cx="516.2" cy="276.3" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<circle cx="1071.7" cy="521.1" r="7" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
<text x="170.6" y="136.3" font-size="13.5"><tspan font-weight="700" fill="#94a3b8">94.77%</tspan><tspan font-size="12" fill="#64748b">  EfficientNet-B0, FP32 &#183; ~10 img/s</tspan></text>
<text x="448.7" y="222.2" font-size="13.5"><tspan font-weight="700" fill="#2563eb">92.21%</tspan><tspan font-size="12" fill="#64748b">  tinyplus_kd_fulltrain, INT8</tspan></text>
<text x="515.2" y="259.8" font-size="13.5"><tspan font-weight="700" fill="#2563eb">91.09%</tspan><tspan font-size="12" fill="#64748b">  tinyfast_xxs, INT8</tspan></text>
<text x="531.2" y="281.3" font-size="13.5"><tspan font-weight="700" fill="#2563eb">90.45%</tspan><tspan font-size="12" fill="#64748b">  tinyfast_xxxs, INT8</tspan></text>
<circle cx="1071.7" cy="521.1" r="16" fill="#ea580c" opacity="0.13"/>
<text x="1138.0" y="481.1" font-size="17" font-weight="700" fill="#ea580c" text-anchor="end">83.16%</text>
<text x="1138.0" y="501.1" font-size="13.5" font-weight="600" fill="#ea580c" text-anchor="end">154 096 img/s</text>
<text x="1138.0" y="553.1" font-size="12" fill="#64748b" text-anchor="end">BNN-PYNQ LFC, 1W1A FPGA fabric</text>
<rect x="752" y="100" width="374" height="212" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="772" y="127" font-size="12.5" font-weight="700" fill="#0f172a" letter-spacing="0.5">READING THE CURVE</text>
<circle cx="780" cy="150" r="5.5" fill="#2563eb"/>
<text x="796" y="154" font-size="12.5" font-weight="600" fill="#0f172a">INT8 CPU tier</text>
<text x="796" y="169" font-size="11" fill="#64748b">down-right is a trade, never a free win</text>
<circle cx="780" cy="181" r="5.5" fill="#ea580c"/>
<text x="796" y="185" font-size="12.5" font-weight="600" fill="#0f172a">1W1A FPGA fabric</text>
<text x="796" y="200" font-size="11" fill="#64748b">the only point in the hundreds of thousands</text>
<circle cx="780" cy="212" r="5.5" fill="#94a3b8"/>
<text x="796" y="216" font-size="12.5" font-weight="600" fill="#0f172a">FP32 reference</text>
<text x="796" y="231" font-size="11" fill="#64748b">what you get by ignoring the target board</text>
<line x1="772" y1="252" x2="1106" y2="252" stroke="#e2e8f0"/>
<text x="772" y="272" font-size="11" fill="#64748b">FINN 4W4A (93.55% host) has no board point: the</text>
<text x="772" y="288" font-size="11" fill="#64748b">bitstream runs, the numerics never closed.</text>
<text x="772" y="304" font-size="11" fill="#64748b">tinyfast_xs has throughput only; no accuracy is published.</text>
<text x="90.0" y="662" font-size="11.5" fill="#64748b">Sources: paper Tables 3, 6, 8 and Section 7 &#183; full 10 000-image board runs &#183; ONNX Runtime 1.16.0, intra_op=2, batch=256</text>
</svg>
