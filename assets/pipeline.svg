<text x="112" y="376" font-size="13" font-weight="700" fill="#0f172a">Brevitas QAT → 1W1A</text>
<text x="112" y="394" font-size="10.5" fill="#64748b">weights and activations binarised</text>
<line x1="336.0" y1="410" x2="336.0" y2="432" stroke="#fed7aa" stroke-width="1.8"/>
<path d="M 336.0 432 l -4 -6 l 8 0 z" fill="#fed7aa"/>
<rect x="96" y="432" width="480" height="58" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
<text x="112" y="456" font-size="13" font-weight="700" fill="#0f172a">BNN-PYNQ fabric</text>
<text x="112" y="475" font-size="10.5" font-weight="600" fill="#2563eb">closed loop</text>
<text x="276" y="475" font-size="10.5" font-weight="600" fill="#0f172a">83.16 % test</text>
<text x="440" y="475" font-size="10.5" font-weight="600" fill="#0f172a">154 096 img/s</text>
<rect x="624" y="352" width="480" height="58" rx="8" fill="#ffffff" stroke="#fed7aa"/>
<text x="640" y="376" font-size="13" font-weight="700" fill="#0f172a">Brevitas QAT → 4W4A</text>
<text x="640" y="394" font-size="10.5" fill="#64748b">FINN-friendly head, dataflow safe</text>
<line x1="864.0" y1="410" x2="864.0" y2="432" stroke="#fed7aa" stroke-width="1.8"/>
<path d="M 864.0 432 l -4 -6 l 8 0 z" fill="#fed7aa"/>
<rect x="624" y="432" width="480" height="58" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
<text x="640" y="456" font-size="13" font-weight="700" fill="#0f172a">FINN bitstream</text>
<text x="640" y="475" font-size="10.5" font-weight="600" fill="#ea580c">bitstream runs</text>
<text x="804" y="475" font-size="10.5" font-weight="600" fill="#0f172a">93.55 % on host</text>
<text x="968" y="475" font-size="10.5" font-weight="600" fill="#64748b">not reached on board</text>
<text x="60" y="568" font-size="11.5" fill="#64748b">The FINN branch is written up as unfinished rather than packaged as a success: the bitstream generates, loads and executes,</text>
<text x="60" y="585" font-size="11.5" fill="#64748b">but its output does not match the golden reference. Root cause is isolated to the stitched-IP integration path &#8212; docs/05.</text>
