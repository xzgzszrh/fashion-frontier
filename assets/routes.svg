<text x="88" y="188" font-size="11.5" fill="#64748b">Static INT8, onnxruntime on the ARM cores</text>
<circle cx="424" cy="170" r="6.5" fill="#16a34a" stroke="#16a34a" stroke-width="2.2"/>
<text x="424" y="194" font-size="9.5" fill="#64748b" text-anchor="middle">train</text>
