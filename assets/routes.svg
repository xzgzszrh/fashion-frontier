<circle cx="490" cy="170" r="6.5" fill="#16a34a" stroke="#16a34a" stroke-width="2.2"/>
<text x="490" y="194" font-size="9.5" fill="#64748b" text-anchor="middle">distill</text>
<line x1="499" y1="170" x2="547" y2="170" stroke="#16a34a" stroke-width="2"/>
<circle cx="556" cy="170" r="6.5" fill="#16a34a" stroke="#16a34a" stroke-width="2.2"/>
<text x="556" y="194" font-size="9.5" fill="#64748b" text-anchor="middle">quantise</text>
<line x1="565" y1="170" x2="613" y2="170" stroke="#16a34a" stroke-width="2"/>
<circle cx="622" cy="170" r="6.5" fill="#16a34a" stroke="#16a34a" stroke-width="2.2"/>
<text x="622" y="194" font-size="9.5" fill="#64748b" text-anchor="middle">export</text>
<line x1="631" y1="170" x2="679" y2="170" stroke="#16a34a" stroke-width="2"/>
<circle cx="688" cy="170" r="6.5" fill="#16a34a" stroke="#16a34a" stroke-width="2.2"/>
<text x="688" y="194" font-size="9.5" fill="#64748b" text-anchor="middle">board</text>
<text x="958" y="156" font-size="9.5" fill="#64748b" text-anchor="end" letter-spacing="0.6">ACCURACY</text>
<text x="958" y="180" font-size="16" font-weight="700" fill="#16a34a" text-anchor="end">92.21%</text>
<text x="958" y="198" font-size="9.5" fill="#64748b" text-anchor="end">closed loop</text>
<text x="1120" y="156" font-size="9.5" fill="#64748b" text-anchor="end" letter-spacing="0.6">THROUGHPUT</text>
<text x="1120" y="180" font-size="16" font-weight="700" fill="#0f172a" text-anchor="end">445 img/s</text>
<text x="1120" y="198" font-size="9.5" fill="#64748b" text-anchor="end">fastest CPU result</text>
<rect x="60" y="240" width="1080" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="60" y="254" width="4" height="68" rx="2" fill="#16a34a"/>
<text x="88" y="278" font-size="15.5" font-weight="700" fill="#0f172a">BNN-PYNQ LFC (1W1A)</text>
<text x="88" y="300" font-size="11.5" fill="#64748b">Binary network on the FPGA fabric</text>
<circle cx="424" cy="282" r="6.5" fill="#16a34a" stroke="#16a34a" stroke-width="2.2"/>
<text x="424" y="306" font-size="9.5" fill="#64748b" text-anchor="middle">train</text>
