<circle cx="490" cy="282" r="6.5" fill="#16a34a" stroke="#16a34a" stroke-width="2.2"/>
<text x="490" y="306" font-size="9.5" fill="#64748b" text-anchor="middle">binarise</text>
<line x1="499" y1="282" x2="547" y2="282" stroke="#16a34a" stroke-width="2"/>
<circle cx="556" cy="282" r="6.5" fill="#16a34a" stroke="#16a34a" stroke-width="2.2"/>
<text x="556" y="306" font-size="9.5" fill="#64748b" text-anchor="middle">export</text>
<line x1="565" y1="282" x2="613" y2="282" stroke="#16a34a" stroke-width="2"/>
<circle cx="622" cy="282" r="6.5" fill="#16a34a" stroke="#16a34a" stroke-width="2.2"/>
<text x="622" y="306" font-size="9.5" fill="#64748b" text-anchor="middle">board</text>
<text x="958" y="268" font-size="9.5" fill="#64748b" text-anchor="end" letter-spacing="0.6">ACCURACY</text>
<text x="958" y="292" font-size="16" font-weight="700" fill="#16a34a" text-anchor="end">83.16%</text>
<text x="958" y="310" font-size="9.5" fill="#64748b" text-anchor="end">closed loop</text>
<text x="1120" y="268" font-size="9.5" fill="#64748b" text-anchor="end" letter-spacing="0.6">THROUGHPUT</text>
<text x="1120" y="292" font-size="16" font-weight="700" fill="#0f172a" text-anchor="end">154 096 img/s</text>
<text x="1120" y="310" font-size="9.5" fill="#64748b" text-anchor="end">batch=256 accelerator</text>
<rect x="60" y="352" width="1080" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="60" y="366" width="4" height="68" rx="2" fill="#ea580c"/>
<text x="88" y="390" font-size="15.5" font-weight="700" fill="#0f172a">FINN mainline (4W4A)</text>
<text x="88" y="412" font-size="11.5" fill="#64748b">FINN-friendly 4-bit QAT, custom bitstream</text>
<circle cx="424" cy="394" r="6.5" fill="#ea580c" stroke="#ea580c" stroke-width="2.2"/>
<text x="424" y="418" font-size="9.5" fill="#64748b" text-anchor="middle">train</text>
<line x1="433" y1="394" x2="481" y2="394" stroke="#ea580c" stroke-width="2"/>
<circle cx="490" cy="394" r="6.5" fill="#ea580c" stroke="#ea580c" stroke-width="2.2"/>
<text x="490" y="418" font-size="9.5" fill="#64748b" text-anchor="middle">QAT</text>
<line x1="499" y1="394" x2="547" y2="394" stroke="#ea580c" stroke-width="2"/>
<circle cx="556" cy="394" r="6.5" fill="#ea580c" stroke="#ea580c" stroke-width="2.2"/>
<text x="556" y="418" font-size="9.5" fill="#64748b" text-anchor="middle">export</text>
<line x1="565" y1="394" x2="613" y2="394" stroke="#ea580c" stroke-width="2"/>
<circle cx="622" cy="394" r="6.5" fill="#ea580c" stroke="#ea580c" stroke-width="2.2"/>
<text x="622" y="418" font-size="9.5" fill="#64748b" text-anchor="middle">build</text>
<line x1="631" y1="394" x2="679" y2="394" stroke="#ea580c" stroke-width="2"/>
<circle cx="688" cy="394" r="6.5" fill="#ea580c" stroke="#ea580c" stroke-width="2.2"/>
<text x="688" y="418" font-size="9.5" fill="#64748b" text-anchor="middle">sim</text>
<line x1="697" y1="394" x2="745" y2="394" stroke="#ea580c" stroke-width="2"/>
<circle cx="754" cy="394" r="6.5" fill="#ffffff" stroke="#ea580c" stroke-width="2.2"/>
<text x="754" y="418" font-size="9.5" fill="#64748b" text-anchor="middle">board</text>
<text x="958" y="380" font-size="9.5" fill="#64748b" text-anchor="end" letter-spacing="0.6">ACCURACY</text>
<text x="958" y="404" font-size="16" font-weight="700" fill="#ea580c" text-anchor="end">93.55% *</text>
<text x="958" y="422" font-size="9.5" fill="#64748b" text-anchor="end">not closed</text>
<text x="1120" y="380" font-size="9.5" fill="#64748b" text-anchor="end" letter-spacing="0.6">THROUGHPUT</text>
<text x="1120" y="404" font-size="16" font-weight="700" fill="#64748b" text-anchor="end">not reached</text>
<text x="1120" y="422" font-size="9.5" fill="#64748b" text-anchor="end">numerics never matched</text>
<text x="60" y="470" font-size="11.5" fill="#64748b">* host accuracy only. The FINN bitstream generates, loads and executes, but its output does not match the golden reference &#8212; the gap is isolated to the stitched-IP integration path.</text>
<text x="60" y="488" font-size="11.5" fill="#64748b">The route is documented as unfinished rather than packaged as a success.</text>
</svg>
