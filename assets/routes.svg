<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 516" width="1200" height="516" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Three deployment routes and their status">
<rect width="1200" height="516" fill="#ffffff"/>
<text x="60" y="46" font-size="25" font-weight="700" fill="#0f172a">Three routes, two closed loops</text>
<text x="60" y="72" font-size="14.5" fill="#64748b">One dataset, one board, three different answers to "how do I deploy this"</text>
<rect x="60" y="128" width="1080" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="60" y="142" width="4" height="68" rx="2" fill="#16a34a"/>
